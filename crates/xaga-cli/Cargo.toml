[package]
name = "xaga-cli"
version = "0.5.3"
edition = "2024"

[dependencies]
xaga-core  = { path = "../xaga-core" }
tokio      = { version = "1", features = ["rt-multi-thread", "macros"] }
clap       = { version = "4", features = ["derive", "env"] }
chrono     = "0.4"
dirs       = "5"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
similar    = "2"
