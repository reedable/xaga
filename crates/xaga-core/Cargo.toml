[package]
name = "xaga-core"
version = "0.9.0-rc.8"
edition = "2024"

[dependencies]
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
feed-rs           = "1"
atom_syndication  = "0.12"
sha2              = "0.10"
hex               = "0.4"
base64            = "0.22"
chrono            = { version = "0.4", features = ["serde"] }
tokio             = { version = "1", features = ["rt", "fs", "sync", "net", "io-util"] }
flume             = "0.11"
dirs              = "5"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
noyalib           = "0.0.15"
url               = "2"
quick-xml         = { version = "0.37", features = ["encoding"] }
uuid              = { version = "1", features = ["v4"] }
fs2               = "0.4"
thiserror         = "2"
log               = "0.4"
scraper           = "0.22"
futures           = "0.3"
bytes             = "1"

# Embeddings pipeline
fastembed           = "=3.14.1"
ort-sys             = { version = "=2.0.0-rc.4", default-features = false, features = ["download-binaries"] }
lancedb             = "0.33"
arrow-array         = "58"
arrow-buffer        = "58"
arrow-schema        = "58"

[dev-dependencies]
tokio               = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile            = "3"
flate2              = "1"
