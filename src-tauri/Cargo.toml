[package]
name = "xaga"
version = "0.5.4"
description = "Privacy-Focused Personal Knowledge Management"
edition = "2024"

[features]
# Enable only when exercising the PDF-routing integration; the application
# consumer still needs PDF persistence before replacing the probe.
wry-pdf-downloads = ["wry/macos-download-pdf"]

[lib]
name = "xaga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
serde_json = "1"

[dependencies]
xaga-core        = { path = "../crates/xaga-core" }
# `macos-proxy` makes `WebviewWindowBuilder::proxy_url` take effect on macOS
# (needs macOS 14+, enforced via bundle.macOS.minimumSystemVersion). Without it,
# the loader's SSRF proxy wiring is a silent no-op on macOS.
# Wry 0.57 no longer gates its background/transparency support on a feature.
# Keep Tauri's macos-private-api flag for its own macOS window support.
tauri            = { version = "2.12.1", features = ["macos-proxy", "macos-private-api"] }
tauri-plugin-log = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
thiserror        = "2"
log              = "0.4"
tokio            = { version = "1", features = ["sync", "time", "net", "io-util", "rt", "macros"] }
notify-debouncer-full = "0.3"
flume            = "0.11"
dirs             = "5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
reqwest             = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
ctrlc               = { version = "3", features = ["termination"] }
sha2                = "0.10"
base64              = "0.22"
tempfile            = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "=0.57.0", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSUUID"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKPreferences", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDate", "NSError", "NSGeometry", "NSRunLoop", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKNavigation", "block2", "objc2-app-kit", "objc2-core-foundation"] }

[[test]]
name = "webview_policy"
harness = false

[[test]]
name = "resource_download_webview"
harness = false
