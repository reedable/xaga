name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  statuses: write

jobs:
  release:
    uses: ./.github/workflows/release-pipeline.yml
    with:
      mode: rc
    secrets:
      version-bump-app-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
