name: Shared release pipeline

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare release source
    runs-on: macos-26
    permissions:
      # GitHub hides draft release evidence from read-only tokens.
      statuses: write
      contents: write
    outputs:
      artifact: ${{ steps.source.outputs.artifact }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare version on clean source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_STATE: ${{ runner.temp }}/prepared-release/release-state.json
        run: |
          mkdir -p "$(dirname "$RELEASE_STATE")"
          node scripts/prepare-release.mjs prepare "$RELEASE_MODE"

      - name: Retain prepared commit identity
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          git bundle create "$RUNNER_TEMP/prepared-release/source.bundle" HEAD "^${GITHUB_SHA}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "artifact=prepared-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload prepared release source
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: ${{ runner.temp }}/prepared-release/
          if-no-files-found: error
          retention-days: 14

      - name: Report failed or cancelled release preparation
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ runner.temp }}/prepared-release/release-state.json
        run: node scripts/release-status.mjs "$RELEASE_STATE" failure

  verify:
    needs: prepare
    uses: ./.github/workflows/verify-source.yml
    with:
      prepared-artifact: ${{ needs.prepare.outputs.artifact }}
      prepared-commit: ${{ needs.prepare.outputs.commit }}

  build:
    name: Build macOS Apple Silicon
    needs: [prepare, verify]
    runs-on: macos-26
    permissions:
      statuses: write
      contents: read
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out original source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore prepared release source
        uses: ./.github/actions/restore-release-source
        with:
          artifact: ${{ needs.prepare.outputs.artifact }}
          commit: ${{ needs.prepare.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust build dependencies
        uses: ./.github/actions/setup-rust-build

      - name: Build distributable
        # Use committed release icons; regeneration can rewrite tracked assets.
        run: >-
          npm run tauri -- build --target aarch64-apple-darwin
          --config '{"build":{"beforeBuildCommand":"npm run ui:build"}}' 

      - name: Verify signature and preserve release identity
        env:
          RELEASE_STATE: ${{ runner.temp }}/prepared-release/release-state.json
          RELEASE_PACKAGE: ${{ runner.temp }}/release-package
        run: node scripts/prepare-release.mjs seal

      - name: Name recovery package
        id: package
        run: echo "artifact=release-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Retain verified artifacts and release identity
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Report failed or cancelled release build
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ runner.temp }}/prepared-release/release-state.json
        run: node scripts/release-status.mjs "$RELEASE_STATE" failure

  report-verification-failure:
    name: Report failed release verification
    needs: [prepare, verify]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.verify.result == 'failure' || needs.verify.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Check out original source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download prepared release identity
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/prepared-release

      - name: Report verification failure for published source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ runner.temp }}/prepared-release/release-state.json
        run: node scripts/release-status.mjs "$RELEASE_STATE" failure

  publish:
    name: Push and create draft
    needs: build
    runs-on: macos-26
    permissions:
      statuses: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out original source for publication
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download verified release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release-package

      - name: Push verified refs and finish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: ${{ runner.temp }}/release-package
        run: node scripts/publish-release.mjs

      - name: Report failed or cancelled publication
        if: ${{ !success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: ${{ runner.temp }}/release-package
        run: node scripts/release-status.mjs "$RELEASE_PACKAGE/release.json" failure
