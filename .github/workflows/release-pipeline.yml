name: Shared release pipeline

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Verify and build macOS Apple Silicon
    runs-on: macos-26
    permissions:
      # GitHub hides draft release evidence from read-only tokens.
      contents: write
      actions: read
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Prepare version on clean source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_STATE: ${{ runner.temp }}/release-state.json
        run: node scripts/prepare-release.mjs prepare "$RELEASE_MODE"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint -- --deny-warnings

      - name: Check formatting
        run: npm run format:check

      - name: Check frontend types
        run: npm run typecheck

      - name: Check reader CSP
        run: node scripts/csp-hash.mjs --check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: aarch64-apple-darwin

      - name: Install Protocol Buffers compiler
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install protobuf && protoc --version

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --locked

      - name: Install Chromium for browser tests
        run: npx playwright install chromium

      - name: Run headless tests
        timeout-minutes: 30
        run: npm run test:headless

      - name: Run browser tests
        timeout-minutes: 30
        run: npm run test:browser

      - name: Upload browser report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-integration-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build distributable
        # Use committed release icons; regeneration can rewrite tracked assets.
        run: >-
          npm run tauri -- build --target aarch64-apple-darwin
          --config '{"build":{"beforeBuildCommand":"npm run ui:build"}}' 

      - name: Verify signature and preserve release identity
        env:
          RELEASE_STATE: ${{ runner.temp }}/release-state.json
          RELEASE_PACKAGE: ${{ runner.temp }}/release-package
        run: node scripts/prepare-release.mjs seal

      - name: Name recovery package
        id: package
        run: echo "artifact=release-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Retain verified artifacts and release identity
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Push and create draft
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out original source for publication
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download verified release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release-package

      - name: Push verified refs and finish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGE: ${{ runner.temp }}/release-package
        run: node scripts/publish-release.mjs
