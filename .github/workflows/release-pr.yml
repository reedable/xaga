name: Verify release PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  # Final build evidence remains on a draft until after the PR merges.
  contents: write
  actions: read
  pull-requests: read
  statuses: write

jobs:
  verify:
    name: Verify final source
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute code from the PR head with this token.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify build evidence and proposed merge tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-pr.mjs
