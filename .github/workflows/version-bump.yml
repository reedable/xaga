name: Shared version bump

on:
  workflow_call:
    inputs:
      bump:
        description: Development version increment (major, minor, or patch)
        required: true
        type: string

    secrets:
      version-bump-app-key:
        required: true

permissions:
  contents: read

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    name: Prepare version bump PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create version bump App token
        id: bump-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.VERSION_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.version-bump-app-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare version bump PR
        env:
          GH_TOKEN: ${{ steps.bump-app.outputs.token }}
          VERSION_BUMP: ${{ inputs.bump }}
        run: node scripts/prepare-version-bump.mjs "$VERSION_BUMP"
