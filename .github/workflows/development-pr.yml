name: Pull request verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: verification-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version-bump:
    name: Identify generated version bump
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'version/')
    runs-on: ubuntu-latest
    outputs:
      matches: ${{ steps.compare.outputs.matches }}
    steps:
      - name: Check out proposed merge and its parents
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare proposed merge with a generated bump
        id: compare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          merge_tree=$(git rev-parse 'HEAD^{tree}')
          git switch --detach "$BASE_SHA"
          increment=$(node --input-type=module <<'JS'
          import { nextVersion } from "./scripts/bump-version.mjs";
          import { readVersionRecords, validateVersionRecords } from "./scripts/release-tag.mjs";

          const current = validateVersionRecords(readVersionRecords());
          if (!/-rc\.\d+$/.test(current)) {
            const increment = ["major", "minor", "patch"].find(
              (kind) => process.env.HEAD_REF === `version/${nextVersion(current, kind)}`
            );
            if (increment) console.log(increment);
          }
          JS
          )
          if [[ -z "$increment" ]]; then
            exit 0
          fi
          npm run "version:$increment"
          git add --update
          if [[ "$(git write-tree)" == "$merge_tree" ]]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: version-bump
    if: ${{ !cancelled() && needs.version-bump.outputs.matches != 'true' }}
    name: Verification
    runs-on: macos-26
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify source
        uses: ./.github/actions/verify

      - name: Run browser tests
        timeout-minutes: 30
        run: npm run test:browser

      - name: Upload browser report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-integration-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check Rust workspace
        run: npm run check:rust

      - name: Run headless tests
        timeout-minutes: 30
        run: npm run test:headless
