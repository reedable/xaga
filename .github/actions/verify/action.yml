name: Verify source
description: Install JavaScript dependencies and run source checks
runs:
  using: composite
  steps:
    - name: Install JavaScript dependencies
      run: npm ci
      shell: bash

    - name: Run linter
      run: npm run lint -- --deny-warnings
      shell: bash

    - name: Check formatting
      run: npm run format:check
      shell: bash

    - name: Check frontend types
      run: npm run typecheck
      shell: bash

    - name: Check reader CSP
      run: node scripts/csp-hash.mjs --check
      shell: bash

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check Rust formatting
      run: cargo fmt --all --check
      shell: bash
