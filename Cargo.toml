[workspace]
members = [
    "crates/xaga-core",
    "crates/xaga-cli",
    "src-tauri",
]
resolver = "2"

# macOS 27 rejects some stripped proc-macro dylibs with a misaligned LINKEDIT.
# Keep build-time libraries loadable until rust-lang/rust#157750 is resolved.
[profile.release.build-override]
strip = "none"

[patch.crates-io]
wry = { git = "https://github.com/reedable/wry.git", rev = "566f7b984147d58e05e69c8dcf8cf6336cc465bb" }
